<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0C0B">
<title>未完工的夏天2010-2013</title>
<meta property="og:title" content="未完工的夏天2010-2013">
<meta property="og:type" content="music.album">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<!-- 粉筆線條的濾鏡，整個頁面共用 -->
<svg id="defs" width="0" height="0" aria-hidden="true" focusable="false"><defs></defs></svg>

<main id="stage" class="light-off">
  <!-- 桌面：由 js/app.js 畫出來 -->
  <div id="desk"></div>

  <!-- 還沒開燈時 -->
  <div id="welcome">
    <svg viewBox="0 0 600 300" role="img" aria-label="未完工的夏天，2010 到 2013。點一下檯燈，開燈。">
      <g class="chalk boil">
        <text class="tx" x="300" y="112" text-anchor="middle" font-size="56">未完工的夏天</text>
        <text class="tx" x="300" y="160" text-anchor="middle" font-size="24" letter-spacing="3" opacity=".6">2010–2013</text>
      </g>
      <g class="chalk boil w-prompt"><text class="tx" x="300" y="252" text-anchor="middle" font-size="26">點一下檯燈，開燈</text></g>
    </svg>
  </div>

  <!-- 關燈後的播放器 -->
  <section id="player" aria-hidden="true" aria-label="播放器">
    <button class="p-x" type="button" data-act="close" aria-label="回到桌面">
      <svg viewBox="0 0 44 44" aria-hidden="true"><g class="chalk boil"><path class="l" d="M13,13 L31,31 M31,13 L13,31"></path></g></svg>
    </button>
    <header class="p-head">
      <h1 id="p-title"></h1>
      <p id="p-credits"></p>
    </header>
    <div id="p-lyrics"></div>
    <svg id="p-controls" viewBox="0 0 320 124" role="group" aria-label="播放控制"></svg>
  </section>
</main>

<audio id="audio" preload="metadata" playsinline></audio>
<script type="module" src="js/app.js"></script>
</body>
</html>
