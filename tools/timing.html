<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>打时间点</title>
<link rel="icon" href="data:,">
<style>
  :root { --bg: #0B0C0B; --ink: #EDE6D3; --dim: #8d887b; --line: #33322e; --hot: #F6DCA6; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 24px 16px 80px; }
  h1 { font-size: 20px; margin: 0 0 4px; font-weight: 600; }
  p { margin: 0 0 12px; color: var(--dim); }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 16px 0; }
  select, button { font: inherit; color: var(--ink); background: none; border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; min-height: 40px; }
  button { cursor: pointer; }
  button:hover, select:hover { border-color: var(--dim); }
  button.primary { border-color: var(--hot); color: var(--hot); }
  audio { width: 100%; margin: 4px 0 12px; }
  kbd { display: inline-block; min-width: 22px; padding: 1px 6px; border: 1px solid var(--line); border-radius: 4px; font: 13px ui-monospace, Menlo, monospace; color: var(--ink); text-align: center; }
  .keys { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--dim); font-size: 14px; margin-bottom: 16px; }
  ol { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); max-height: 52vh; overflow: auto; }
  li { display: grid; grid-template-columns: 34px 78px 1fr; gap: 10px; align-items: baseline; padding: 7px 8px; border-bottom: 1px solid var(--line); cursor: pointer; }
  li .n { color: var(--dim); font-size: 13px; text-align: right; }
  li .t { font: 14px ui-monospace, Menlo, monospace; color: var(--dim); }
  li.done .t { color: var(--ink); }
  li.next { background: #1b1a16; }
  li.next .x { color: var(--hot); }
  li.playing .x { font-weight: 600; }
  li.sel { outline: 1px solid var(--hot); outline-offset: -1px; }
  #status { color: var(--dim); font-size: 14px; }
  textarea { width: 100%; height: 160px; margin-top: 12px; background: #111210; color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 10px; font: 13px/1.5 ui-monospace, Menlo, monospace; }
</style>
</head>
<body>
<main>
<h1>打时间点</h1>
<p>放歌，每唱到一句的开头就按一下空格。打完导出，把文件存成这首歌的 .lrc。</p>

<div class="bar">
  <label for="song">歌：</label>
  <select id="song"></select>
  <button id="play" class="primary" type="button">播放 / 暂停</button>
  <button id="stamp" type="button">打点（空格）</button>
  <button id="undo" type="button">撤销上一个</button>
  <button id="reset" type="button">全部清空</button>
</div>

<audio id="audio" controls preload="auto"></audio>

<div class="keys">
  <span><kbd>空格</kbd> 给下一句打点</span>
  <span><kbd>Enter</kbd> 播放 / 暂停</span>
  <span><kbd>⌫</kbd> 撤销并退回 3 秒</span>
  <span><kbd>←</kbd><kbd>→</kbd> 退 / 进 3 秒</span>
  <span><kbd>[</kbd><kbd>]</kbd> 选中的那句提前 / 推后 0.1 秒</span>
  <span><kbd>T</kbd> 把选中的那句改成现在这一刻</span>
  <span>点某一句：选中它并跳到它的时间</span>
</div>

<div id="saved" style="color: var(--hot); font-size: 14px; margin-bottom: 6px"></div>
<div id="status"></div>
<ol id="lines"></ol>

<div class="bar">
  <button id="download" class="primary" type="button">下载 .lrc</button>
  <button id="copy" type="button">复制</button>
  <span id="done" style="color: var(--dim); font-size: 14px"></span>
</div>
<textarea id="out" readonly aria-label="导出的 LRC"></textarea>
</main>

<script>
const $ = (s) => document.querySelector(s);
const audio = $('#audio');
const list = $('#lines');
let songs = [];
let song = null;
let lines = [];      // [{ text, t }]，t 为 null 表示还没打点
let sel = -1;

const fmt = (t) => {
  if (t == null) return '--:--.--';
  const m = Math.floor(t / 60);
  const s = (t - m * 60).toFixed(2).padStart(5, '0');
  return String(m).padStart(2, '0') + ':' + s;
};
const nextIndex = () => lines.findIndex((l) => l.t == null);
const storeKey = () => 'timing:' + song.id;

function toLrc() {
  return lines.filter((l) => l.t != null).map((l) => `[${fmt(l.t)}]${l.text}`).join('\n') + '\n';
}

function save() {
  try { localStorage.setItem(storeKey(), JSON.stringify(lines.map((l) => l.t))); } catch (e) { /* 存不了就算了 */ }
}

function render() {
  const next = nextIndex();
  const now = audio.currentTime;
  let playing = -1;
  lines.forEach((l, i) => { if (l.t != null && l.t <= now) playing = i; });
  list.innerHTML = lines.map((l, i) => {
    const cls = [l.t != null ? 'done' : '', i === next ? 'next' : '', i === playing ? 'playing' : '', i === sel ? 'sel' : ''].join(' ');
    return `<li class="${cls}" data-i="${i}"><span class="n">${i + 1}</span><span class="t">${fmt(l.t)}</span><span class="x"></span></li>`;
  }).join('');
  list.querySelectorAll('li').forEach((li, i) => { li.querySelector('.x').textContent = lines[i].text; });
  const done = lines.filter((l) => l.t != null).length;
  $('#status').textContent = `已打 ${done} / ${lines.length} 句` + (next >= 0 ? `，下一句：第 ${next + 1} 句` : '，全部打完了');
  $('#out').value = toLrc();
  const focus = list.querySelector('li.next') || list.querySelector('li.playing');
  if (focus && !audio.paused) focus.scrollIntoView({ block: 'center' });
}

function stamp() {
  const i = nextIndex();
  if (i < 0) return;
  lines[i].t = Math.max(0, Math.round(audio.currentTime * 100) / 100);
  sel = i;
  save();
  render();
}

function undo() {
  let i = -1;
  lines.forEach((l, k) => { if (l.t != null) i = k; });
  if (i < 0) return;
  lines[i].t = null;
  sel = -1;
  audio.currentTime = Math.max(0, audio.currentTime - 3);
  save();
  render();
}

function nudge(d) {
  if (sel < 0 || lines[sel].t == null) return;
  lines[sel].t = Math.max(0, Math.round((lines[sel].t + d) * 100) / 100);
  audio.currentTime = lines[sel].t;
  save();
  render();
}

/** 把选中的那一句改成"现在正在播的这一刻" */
function retime() {
  if (sel < 0) return;
  lines[sel].t = Math.max(0, Math.round(audio.currentTime * 100) / 100);
  save();
  render();
}

async function load(id) {
  song = songs.find((s) => s.id === id);
  audio.src = '../' + song.audio;
  let texts = [];
  let times = [];
  if (song.lyricsText) {
    const raw = await (await fetch('../' + song.lyricsText)).text();
    texts = raw.split(/\r?\n/).map((s) => s.trim()).filter(Boolean);
  }
  try { times = JSON.parse(localStorage.getItem(storeKey()) || '[]'); } catch (e) { times = []; }
  let note = times.some((t) => typeof t === 'number') ? '已恢复你上次改到一半的进度' : '';
  // 没有自己打过的进度时，载入现有的 .lrc（比如自动对齐的初稿）来校对
  if (!note && song.lyrics) {
    try {
      const raw = await (await fetch('../' + song.lyrics, { cache: 'no-store' })).text();
      const rows = raw.split(/\r?\n/).map((r) => r.match(/^\[(\d+):(\d+(?:\.\d+)?)\]/)).filter(Boolean);
      if (!/^佔位/.test(raw) && rows.length === texts.length) {
        times = rows.map((m) => Number(m[1]) * 60 + Number(m[2]));
        note = '已载入现有的时间轴。播放时看高亮的那一句是不是正在唱的；不对就点它，再微调';
      }
    } catch (e) { /* 没有就从头打 */ }
  }
  lines = texts.map((text, i) => ({ text, t: typeof times[i] === 'number' ? times[i] : null }));
  sel = -1;
  $('#saved').textContent = note;
  if (!texts.length) $('#status').textContent = '这首歌还没有歌词文本（songs.json 里的 lyricsText）';
  render();
}

$('#play').onclick = () => { if (audio.paused) audio.play(); else audio.pause(); };
$('#stamp').onclick = stamp;
$('#undo').onclick = undo;
$('#reset').onclick = () => {
  if (!confirm('清空这首歌已经打好的所有时间点？')) return;
  lines.forEach((l) => { l.t = null; });
  sel = -1; save(); render();
};
$('#song').onchange = (e) => load(e.target.value);
$('#copy').onclick = async () => { await navigator.clipboard.writeText(toLrc()); $('#done').textContent = '已复制'; };
$('#download').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([toLrc()], { type: 'text/plain;charset=utf-8' }));
  a.download = song.id + '.lrc';
  a.click();
  URL.revokeObjectURL(a.href);
  $('#done').textContent = '已下载 ' + song.id + '.lrc，放进 lyrics 文件夹替换原来的即可';
};
list.onclick = (e) => {
  const li = e.target.closest('li');
  if (!li) return;
  sel = Number(li.dataset.i);
  if (lines[sel].t != null) audio.currentTime = lines[sel].t;
  render();
};
audio.addEventListener('timeupdate', render);
// 按钮和播放条不留焦点，否则空格会同时触发它们自己的动作
document.addEventListener('click', (e) => { if (e.target.closest('button')) e.target.closest('button').blur(); });
audio.addEventListener('focus', () => audio.blur());

document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA') return;
  if (e.key === ' ') { e.preventDefault(); stamp(); }
  else if (e.key === 'Enter') { e.preventDefault(); $('#play').onclick(); }
  else if (e.key === 'Backspace') { e.preventDefault(); undo(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); audio.currentTime = Math.max(0, audio.currentTime - 3); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); audio.currentTime += 3; }
  else if (e.key === '[') nudge(-0.1);
  else if (e.key === ']') nudge(0.1);
  else if (e.key === 't' || e.key === 'T') retime();
});

(async () => {
  const data = await (await fetch('../songs.json')).json();
  songs = data.songs.filter((s) => !s.dev);
  $('#song').innerHTML = songs.map((s) => `<option value="${s.id}"></option>`).join('');
  [...$('#song').options].forEach((o, i) => { o.textContent = songs[i].title; });
  if (songs.length) load(songs[0].id);
})();
</script>
</body>
</html>
