<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>歌词时间校对</title>
<link rel="icon" href="data:,">
<style>
  :root { --bg: #0B0C0B; --ink: #EDE6D3; --dim: #8d887b; --line: #33322e; --hot: #F6DCA6; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 24px 16px 80px; }
  h1 { font-size: 20px; margin: 0 0 4px; font-weight: 600; }
  p { margin: 0 0 12px; color: var(--dim); }
  code { font: 14px ui-monospace, Menlo, monospace; color: var(--ink); }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 16px 0; }
  select, button { font: inherit; color: var(--ink); background: none; border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; min-height: 40px; }
  button { cursor: pointer; }
  button:hover, select:hover { border-color: var(--dim); }
  button.primary { border-color: var(--hot); color: var(--hot); }
  audio { width: 100%; margin: 4px 0 12px; }
  kbd { display: inline-block; min-width: 22px; padding: 1px 6px; border: 1px solid var(--line); border-radius: 4px; font: 13px ui-monospace, Menlo, monospace; color: var(--ink); text-align: center; }
  .keys { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--dim); font-size: 14px; margin-bottom: 16px; }
  ol { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); max-height: 52vh; overflow: auto; }
  li { display: grid; grid-template-columns: 34px 78px 1fr; gap: 10px; align-items: baseline; padding: 7px 8px; border-bottom: 1px solid var(--line); cursor: pointer; }
  li .n { color: var(--dim); font-size: 13px; text-align: right; }
  li .t { font: 14px ui-monospace, Menlo, monospace; color: var(--dim); }
  li.done .t { color: var(--ink); }
  li.next { background: #1b1a16; }
  li.next .x { color: var(--hot); }
  li.playing .x { font-weight: 600; }
  li.sel { outline: 1px solid var(--hot); outline-offset: -1px; }
  #note { color: var(--hot); font-size: 14px; min-height: 21px; margin-bottom: 6px; }
  #status { color: var(--dim); font-size: 14px; }
</style>
</head>
<body>
<main>
<h1>歌词时间校对</h1>
<p>每首歌的歌词只有一个文件（<code id="path"></code>），字和时间都在里面。改字、拆行、并行请用文本编辑器直接改那个文件；这里只负责时间。</p>

<div class="bar">
  <label for="song">歌：</label>
  <select id="song"></select>
  <button id="play" class="primary" type="button">播放 / 暂停</button>
  <button id="stamp" type="button">打点（空格）</button>
  <button id="reload" type="button">重新读取文件</button>
</div>

<audio id="audio" controls preload="auto"></audio>

<div class="keys">
  <span><kbd>空格</kbd> 给下一句没有时间的打点</span>
  <span><kbd>Enter</kbd> 播放 / 暂停</span>
  <span><kbd>T</kbd> 把选中的那句改成现在这一刻</span>
  <span><kbd>[</kbd><kbd>]</kbd> 选中的那句提前 / 推后 0.1 秒</span>
  <span><kbd>⌫</kbd> 清掉选中那句的时间</span>
  <span><kbd>←</kbd><kbd>→</kbd> 退 / 进 3 秒</span>
  <span>点某一句：选中它并跳到它的时间</span>
</div>

<div id="note"></div>
<div id="status"></div>
<ol id="lines"></ol>

<div class="bar">
  <button id="save" class="primary" type="button">保存到文件</button>
  <button id="download" type="button">下载</button>
  <span id="done" style="color: var(--dim); font-size: 14px"></span>
</div>
</main>

<script>
const $ = (s) => document.querySelector(s);
const audio = $('#audio');
const list = $('#lines');
let songs = [];
let song = null;
let header = [];     // 文件开头的 # 说明行，保存时原样写回
let lines = [];      // [{ text, t }]，t 为 null 表示还没有时间
let sel = -1;
let dirty = false;

const fmt = (t) => {
  if (t == null) return '--:--.--';
  const m = Math.floor(t / 60);
  const s = (t - m * 60).toFixed(2).padStart(5, '0');
  return String(m).padStart(2, '0') + ':' + s;
};
const round = (t) => Math.max(0, Math.round(t * 100) / 100);
const nextIndex = () => lines.findIndex((l) => l.t == null);

function parse(raw) {
  header = [];
  const out = [];
  for (const r of raw.split(/\r?\n/)) {
    const line = r.trim();
    if (line.startsWith('#')) { if (!out.length) header.push(r); continue; }
    if (!line) continue;
    const m = line.match(/^\[(\d+):(\d+(?:\.\d+)?)\]\s*(.*)$/);
    if (m) { if (m[3]) out.push({ text: m[3], t: Number(m[1]) * 60 + Number(m[2]) }); }
    else out.push({ text: line, t: null });
  }
  return out;
}

function serialize() {
  const head = header.length ? header.join('\n') + '\n\n' : '';
  return head + lines.map((l) => (l.t == null ? l.text : `[${fmt(l.t)}] ${l.text}`)).join('\n') + '\n';
}

function touch() { dirty = true; $('#done').textContent = '有改动还没保存'; }

function render() {
  const next = nextIndex();
  const now = audio.currentTime;
  let playing = -1;
  lines.forEach((l, i) => { if (l.t != null && l.t <= now) playing = i; });
  list.innerHTML = lines.map((l, i) => {
    const cls = [l.t != null ? 'done' : '', i === next ? 'next' : '', i === playing ? 'playing' : '', i === sel ? 'sel' : ''].join(' ');
    return `<li class="${cls}" data-i="${i}"><span class="n">${i + 1}</span><span class="t">${fmt(l.t)}</span><span class="x"></span></li>`;
  }).join('');
  list.querySelectorAll('li').forEach((li, i) => { li.querySelector('.x').textContent = lines[i].text; });
  const done = lines.filter((l) => l.t != null).length;
  const order = lines.filter((l) => l.t != null).some((l, i, a) => i > 0 && l.t < a[i - 1].t);
  $('#status').textContent = `${lines.length} 句，${done} 句有时间` + (next >= 0 ? `，下一句要打点的是第 ${next + 1} 句` : '')
    + (order ? '。注意：有的句子时间比上一句还早' : '');
  const focus = list.querySelector('li.playing') || list.querySelector('li.next');
  if (focus && !audio.paused) focus.scrollIntoView({ block: 'center' });
}

function stamp() {
  const i = nextIndex();
  if (i < 0) return;
  lines[i].t = round(audio.currentTime);
  sel = i;
  touch(); render();
}

function retime() {
  if (sel < 0) return;
  lines[sel].t = round(audio.currentTime);
  touch(); render();
}

function nudge(d) {
  if (sel < 0 || lines[sel].t == null) return;
  lines[sel].t = round(lines[sel].t + d);
  audio.currentTime = lines[sel].t;
  touch(); render();
}

function clearSel() {
  if (sel < 0 || lines[sel].t == null) return;
  lines[sel].t = null;
  touch(); render();
}

async function load(id) {
  if (dirty && !confirm('有改动还没保存，确定丢掉？')) { $('#song').value = song.id; return; }
  song = songs.find((s) => s.id === id);
  $('#path').textContent = song.lyrics || '（这首歌在 songs.json 里还没有 lyrics）';
  if (audio.src.split('/').pop() !== song.audio.split('/').pop()) audio.src = '../' + song.audio;
  lines = [];
  if (song.lyrics) {
    try {
      const res = await fetch('../' + song.lyrics, { cache: 'no-store' });
      if (res.ok) lines = parse(await res.text());
    } catch (e) { /* 读不到就当作空的 */ }
  }
  sel = -1;
  dirty = false;
  $('#done').textContent = '';
  const missing = lines.filter((l) => l.t == null).length;
  $('#note').textContent = !lines.length ? '这首歌还没有歌词。先把歌词一行一句写进上面那个文件。'
    : missing ? `有 ${missing} 句还没有时间。放歌，唱到那一句的开头时按空格。`
    : '每一句都有时间了。播放时看加粗的那一句是不是正在唱的；不对就点它，再按 T 或 [ ] 调整。';
  render();
}

async function save() {
  if (!song.lyrics) return;
  try {
    const res = await fetch('../' + song.lyrics, { method: 'PUT', body: serialize(), headers: { 'Content-Type': 'text/plain; charset=utf-8' } });
    if (!res.ok) throw new Error(String(res.status));
    dirty = false;
    $('#done').textContent = '已保存到 ' + song.lyrics + '，刷新网页就能看到';
  } catch (e) {
    $('#done').textContent = '这里没法直接保存（需要用 dev-server.py 在本机打开）。请点"下载"，再替换原文件。';
  }
}

$('#play').onclick = () => { if (audio.paused) audio.play(); else audio.pause(); };
$('#stamp').onclick = stamp;
$('#reload').onclick = () => load(song.id);
$('#save').onclick = save;
$('#song').onchange = (e) => load(e.target.value);
$('#download').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([serialize()], { type: 'text/plain;charset=utf-8' }));
  a.download = song.lyrics.split('/').pop();
  a.click();
  URL.revokeObjectURL(a.href);
};
list.onclick = (e) => {
  const li = e.target.closest('li');
  if (!li) return;
  sel = Number(li.dataset.i);
  if (lines[sel].t != null) audio.currentTime = lines[sel].t;
  render();
};
audio.addEventListener('timeupdate', render);
// 按钮和播放条不留焦点，否则空格会同时触发它们自己的动作
document.addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) b.blur(); });
audio.addEventListener('focus', () => audio.blur());
window.addEventListener('beforeunload', (e) => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'SELECT') return;
  if (e.key === ' ') { e.preventDefault(); stamp(); }
  else if (e.key === 'Enter') { e.preventDefault(); $('#play').onclick(); }
  else if (e.key === 'Backspace') { e.preventDefault(); clearSel(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); audio.currentTime = Math.max(0, audio.currentTime - 3); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); audio.currentTime += 3; }
  else if (e.key === '[') nudge(-0.1);
  else if (e.key === ']') nudge(0.1);
  else if (e.key === 't' || e.key === 'T') retime();
});

(async () => {
  const data = await (await fetch('../songs.json', { cache: 'no-store' })).json();
  songs = data.songs.filter((s) => !s.dev);
  $('#song').innerHTML = songs.map((s) => `<option value="${s.id}"></option>`).join('');
  [...$('#song').options].forEach((o, i) => { o.textContent = songs[i].title; });
  if (songs.length) load(songs[0].id);
})();
</script>
</body>
</html>
